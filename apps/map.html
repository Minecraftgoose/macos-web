CES.map(s=>s.key);const idx=keys.indexOf(CONFIG.currentLayer);loadTileLayer(keys[(idx+1)%keys.length])};function addMarker(lat,lon,popup){if(currentMarker)map.removeLayer(currentMarker);const icon=L.divIcon({className:'custom-marker',html:`<div style="width:34px;height:34px;background:var(--accent);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 3px 12px rgba(0,0,0,0.30);display:flex;align-items:center;justify-content:center;"><div style="width:10px;height:10px;background:white;border-radius:50%;"></div></div>`,iconSize:[34,34],iconAnchor:[17,34]});currentMarker=L.marker([lat,lon],{icon}).addTo(map);if(popup)currentMarker.bindPopup(popup,{maxWidth:260}).openPopup()}function onMapClick(e){const{lat,lng}=e.latlng;updateCoords();fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-CN`).then(r=>r.json()).then(data=>{addMarker(lat,lng,data.display_name||`${lat.toFixed(5)}, ${lng.toFixed(5)}`)}).catch(()=>{addMarker(lat,lng,`${lat.toFixed(6)}, ${lng.toFixed(6)}`)})}async function doSearch(q){if(q.length<2){searchResults.innerHTML=`<div class="result-empty">输入至少2个字符开始搜索</div>`;return}searchResults.innerHTML=`<div class="result-loading"><div class="spinner"></div><div>搜索中…</div></div>`;try{const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&accept-language=zh-CN`);if(!res.ok)throw new Error('API 请求失败');const data=await res.json();if(!data||!data.length){searchResults.innerHTML=`<div class="result-empty">😕 未找到相关地点</div>`;return}searchResults.innerHTML=data.map(item=>`<div class="result-item" data-lat="${item.lat}" data-lon="${item.lon}" data-name="${item.display_name}"><div class="name">${item.name||item.display_name.split(',')[0]}</div><div class="detail">${item.display_name}</div></div>`).join('');searchResults.querySelectorAll('.result-item').forEach(el=>{el.addEventListener('click',()=>{const lat=parseFloat(el.dataset.la ntains('show'))closeSearchPanelFn()}overlay.addEventListener('click',closeAllPanels);$('menuBtn').addEventListener('click',()=>{sideMenu.classList.add('show');overlay.classList.add('show')});$('closeSideMenu').addEventListener('click',closeAllPanels);$('mapModeBtn').addEventListener('click',()=>{modePopup.classList.toggle('show');overlay.classList.toggle('show',modePopup.classList.contains('show'))});document.querySelectorAll('.mode-opt').forEach(opt=>{opt.addEventListener('click',function(){document.querySelectorAll('.mode-opt').forEach(o=>o.classList.remove('active'));this.classList.add('active');loadTileLayer(this.dataset.layer);modePopup.classList.remove('show');overlay.classList.remove('show')})});$('trafficBtn').addEventListener('click',()=>{const toggle=$('trafficToggle');toggle.classList.toggle('on');alert(toggle.classList.contains('on')?'🚦 路况已开启（模拟）':'🚦 路况已关闭')});$('trafficToggle').addEventListener('click',function(){this.classList.toggle('on')});$('labelToggle').addEventListener('click',function(){this.classList.toggle('on')});$('themeBtn').addEventListener('click',()=>{CONFIG.darkMode=!CONFIG.darkMode;applyTheme()});$('locateBtn').addEventListener('click',()=>{const btn=$('locateBtn');btn.style.transform='scale(0.88)';setTimeout(()=>btn.style.transform='',300);navigator.geolocation.getCurrentPosition(pos=>{map.setView([pos.coords.latitude,pos.coords.longitude],15);addMarker(pos.coords.latitude,pos.coords.longitude,'📍 当前位置')},err=>alert('定位失败: '+err.message),{enableHighAccuracy:true,timeout:12000})});$('zoomInBtn').addEventListener('click',()=>map&&map.zoomIn());$('zoomOutBtn').addEventListener('click',()=>map&&map.zoomOut());document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeAllPanels()});window.addEventListener('resize',()=>{const h=window.innerHeight;document.getElementById('map').style.height=h+'px';if(map)map.invalidateSize({animate:false});if(isWebKit){document.querySelectorAll('.glass__refract.active').forEach(el=>{const parent=el.parentElement;if(parent&&parent._refractSync)parent._refractSync()})}});if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initMap)}else{initMap()}if(MutationObserver){const tileObs=new MutationObserver(()=>{document.querySelectorAll('.leaflet-tile').forEach(tile=>{const f=CONFIG.darkMode?'brightness(0.78) contrast(1.12)':'none';if(tile.style.filter!==f)tile.style.filter=f})});tileObs.observe(document.getElementById('map'),{childList:true,subtree:true})}</script></body></html>
