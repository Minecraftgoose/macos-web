<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: rgba(0,0,0,0.05); font-family: -apple-system, BlinkMacSystemFont; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 顶部横幅（参考 Microsoft Store hero） */
        .store-hero { position: relative; border-radius: 18px; padding: 26px 28px; color: #fff; overflow: hidden; margin-bottom: 24px; background: linear-gradient(120deg, #007aff, #0a84ff 45%, #af52de); box-shadow: 0 8px 24px rgba(0,122,255,0.28); }
        .store-hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,0.16); filter: blur(8px); }
        .store-hero-kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
        .store-hero-title { margin: 6px 0 4px; font-size: 28px; font-weight: 700; line-height: 1.2; }
        .store-hero-sub { margin: 0; font-size: 14px; opacity: 0.9; }

        /* 左侧分类菜单（参考 Microsoft Store 布局） */
        .store-layout { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: start; }
        .store-menu { position: sticky; top: 0; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.85); border-radius: 14px; padding: 10px 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .store-menu .menu-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 10px; cursor: pointer; color: #666; font-size: 11px; text-decoration: none; transition: background-color 150ms, color 150ms; }
        .store-menu .menu-item:hover { background: rgba(0,0,0,0.05); }
        .store-menu .menu-item i { font-size: 18px; color: #8e8e93; transition: color 150ms; }
        .store-menu .menu-item.check { background: rgba(0,122,255,0.12); color: #007aff; }
        .store-menu .menu-item.check i { color: #007aff; }
        .store-empty { color: #666; padding: 20px; text-align: center; }

        /* 应用网格与横向卡片（参考 Microsoft Store） */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
        .store-card { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.95); border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); transition: background-color 200ms; }
        .store-card:hover { background: rgba(255,255,255,1); }
        .store-card-icon { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .store-card-icon img { width: 48px; height: 48px; object-fit: contain; }
        .store-card-info { flex: 1; min-width: 0; }
        .store-card-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .store-card-desc { font-size: 13px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .store-card-cate { display: inline-block; margin-top: 4px; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(0,122,255,0.1); color: #007aff; }
        .store-card-act { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
        .store-card-act .get, .store-card-act .open-btn, .store-card-act .uninstall-btn {
            border: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; white-space: nowrap;
        }
        .store-card-act .get { background: linear-gradient(120deg, #007aff, #0a84ff); color: #fff; }
        .store-card-act .open-btn { background: rgba(0,0,0,0.08); color: #1d1d1f; }
        .store-card-act .uninstall-btn { background: rgba(255,59,48,0.12); color: #ff3b30; }
        .loading { color: #666; padding: 20px; text-align: center; }
    </style>
<style>
body { cursor: url('../webp/cursor-normal.png') 4 4, default; }
input, textarea, [contenteditable="true"] { cursor: text; }
</style>
</head>
<body>
<div class="container store-layout">
    <nav class="store-menu" id="storeMenu">
        <a class="menu-item check" data-cat="all" title="全部"><i class="fas fa-th-large"></i><span>全部</span></a>
        <a class="menu-item" data-cat="featured" title="推荐"><i class="fas fa-star"></i><span>推荐</span></a>
        <a class="menu-item" data-cat="installed" title="已安装"><i class="fas fa-download"></i><span>已装</span></a>
    </nav>
    <div class="store-page">
        <div class="store-hero">
            <div class="store-hero-kicker"><i class="fab fa-apple"></i> App Store</div>
            <div class="store-hero-title" id="heroTitle">全部应用</div>
            <div class="store-hero-sub">应用目录来自 Supabase，随时更新</div>
        </div>
        <div id="app-list" class="store-grid"><div class="loading">加载中...</div></div>
    </div>
</div>

<script>
    // ========== 完全使用 postMessage，避免跨域 ==========
    function sendToParent(action, payload) {
        window.parent.postMessage({ type: 'appStore', action, payload }, '*');
    }

    // ========== 推荐应用渲染 ==========
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    function domainOf(url) { try { return new URL(url).hostname; } catch(e) { return ''; } }

    // 图标兜底：icon_url 为空时用国内可访问的 ico.la4.cn 自动生成
    function iconUrlOf(r) {
        if (r.icon_url) return r.icon_url;
        var d = domainOf(r.url);
        return d ? 'https://ico.la4.cn/ico.php?url=' + d : '';
    }

    // ========== Supabase 应用目录（不再硬编码） ==========
    const SUPABASE_URL = 'https://lmumcldjujmkudpqdsyx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxtdW1jbGRqdWpta3VkcHFkc3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1OTQ1OTMsImV4cCI6MjA5MzE3MDU5M30.5_kELeTI_MkD0KI8tE-EgKQAf_-2RsP1QW8mYW601XU';

    let APP_CATALOG = {};
    let CATEGORIES = [];
    let currentCat = 'all';

    async function fetchCatalog() {
        try {
            const res = await fetch(SUPABASE_URL + '/rest/v1/mac_app?select=id,name,url,description,icon_url,category,featured_order&is_published=eq.true&order=sort_order.asc', {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                }
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const rows = await res.json();
            APP_CATALOG = {};
            const catSet = [];
            (rows || []).forEach(function(r) {
                APP_CATALOG[r.id] = {
                    id: r.id,
                    name: r.name,
                    url: r.url,
                    desc: r.description || '',
                    icon_url: iconUrlOf(r),
                    cate: r.category || '推荐',
                    featured: r.featured_order != null ? r.featured_order : null
                };
                const c = r.category || '推荐';
                if (catSet.indexOf(c) === -1) catSet.push(c);
            });
            CATEGORIES = catSet;
            // 向父窗口注册目录
            sendToParent('registerApps', APP_CATALOG);
            renderMenu();
            renderRecommended();
        } catch (err) {
            var list = document.getElementById('app-list');
            if (list) list.innerHTML = '<div style="color:#ff3b30; padding:20px;">商店目录加载失败：' + escapeHtml(err.message || String(err)) + '</div>';
        }
    }

    // ========== 分类菜单 ==========
    function catIcon(cat) {
        var m = { '推荐': 'fa-star', '工具': 'fa-wrench', '游戏': 'fa-gamepad', '社交': 'fa-comments', '娱乐': 'fa-film', '购物': 'fa-shopping-cart', '教育': 'fa-graduation-cap', '新闻': 'fa-newspaper' };
        return m[cat] || 'fa-tag';
    }

    function renderMenu() {
        var menu = document.getElementById('storeMenu');
        if (!menu) return;
        // 动态分类插到"已装"前面；"推荐"是精选位（featured_order），不作为分类
        var anchor = menu.querySelector('[data-cat="installed"]');
        CATEGORIES.forEach(function(cat) {
            if (cat === '推荐') return;
            var a = document.createElement('a');
            a.className = 'menu-item';
            a.dataset.cat = cat;
            a.title = cat;
            a.innerHTML = '<i class="fas ' + catIcon(cat) + '"></i><span>' + escapeHtml(cat) + '</span>';
            menu.insertBefore(a, anchor);
        });
        menu.querySelectorAll('.menu-item').forEach(function(item) {
            item.addEventListener('click', function() { switchCat(this.dataset.cat); });
        });
    }

    function switchCat(cat) {
        currentCat = cat;
        document.querySelectorAll('#storeMenu .menu-item').forEach(function(m) {
            m.classList.toggle('check', m.dataset.cat === cat);
        });
        var titles = { all: '全部应用', featured: '推荐', installed: '已安装' };
        document.getElementById('heroTitle').textContent = titles[cat] || cat;
        renderRecommended();
    }

    // 请求已安装列表
    sendToParent('getInstalledApps');

    let installedApps = [];

    function renderRecommended() {
        var container = document.getElementById('app-list');
        if (!container) return;
        var ids = Object.keys(APP_CATALOG).filter(function(id) {
            var app = APP_CATALOG[id];
            if (currentCat === 'all') return true;
            if (currentCat === 'installed') return installedApps.includes(id);
            if (currentCat === 'featured') return app.featured != null;
            return (app.cate || '推荐') === currentCat;
        });
        if (currentCat === 'featured') {
            ids.sort(function(a, b) { return (APP_CATALOG[a].featured || 0) - (APP_CATALOG[b].featured || 0); });
        }
        if (ids.length === 0) {
            container.innerHTML = '<div class="store-empty">' + (currentCat === 'installed' ? '还没有安装任何应用，去「全部」里挑一个吧' : '该分类下暂无应用') + '</div>';
            return;
        }
        var html = '';
        ids.forEach(function(id) {
            var app = APP_CATALOG[id];
            var isInstalled = installedApps.includes(id);
            var iconUrl = app.icon_url || '';
            html += '<div class="store-card">' +
                '<div class="store-card-icon">' + (iconUrl ? '<img src="' + iconUrl + '" onerror="this.onerror=null; this.parentElement.innerHTML=\'<i class=\\\'fas fa-globe\\\' style=\\\'font-size:48px;color:#007aff\\\'></i>\'">' : '<i class="fas fa-globe" style="font-size:48px;color:#007aff"></i>') + '</div>' +
                '<div class="store-card-info">' +
                    '<div class="store-card-name">' + escapeHtml(app.name) + '</div>' +
                    '<div class="store-card-desc">' + escapeHtml(app.desc) + '</div>' +
                    '<span class="store-card-cate">' + escapeHtml(app.cate || '推荐') + '</span>' +
                '</div>' +
                '<div class="store-card-act">' + (isInstalled ?
                    '<button class="open-btn" data-id="' + id + '">打开</button><button class="uninstall-btn" data-id="' + id + '">移除</button>' :
                    '<button class="get" data-id="' + id + '">获取</button>') +
                '</div></div>';
        });
        container.innerHTML = html;

        // 绑定事件（全部 postMessage）
        container.querySelectorAll('.get').forEach(btn => {
            btn.addEventListener('click', function() {
                var id = this.dataset.id;
                sendToParent('install', id);
                btn.disabled = true;
                btn.textContent = '安装中...';
                setTimeout(function() { btn.disabled = false; btn.textContent = '获取'; }, 3000);
            });
        });
        container.querySelectorAll('.open-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                var id = this.dataset.id;
                sendToParent('openApp', id);
            });
        });
        container.querySelectorAll('.uninstall-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                var id = this.dataset.id;
                if (await confirm('确定移除？')) {
                    sendToParent('uninstall', id);
                }
            });
        });
    }

    // ========== 监听父窗口消息 ==========
    window.addEventListener('message', function(e) {
        if (e.data.type === 'appStore' && e.data.action === 'installedList') {
            installedApps = e.data.apps || [];
            renderRecommended();
        }
    });

    // 初次渲染（目录从 Supabase 异步拉取）
    fetchCatalog();
</script>
<script>
(function(){
    var seq = 0;
    var pending = {};
    window.addEventListener('message', function(e){
        var d = e.data;
        if (d && d.type === 'macosDialogResult' && pending[d.reqId]) {
            pending[d.reqId](d.result);
            delete pending[d.reqId];
        }
    });
    function send(op, payload) {
        return new Promise(function(resolve){
            var reqId = ++seq;
            pending[reqId] = resolve;
            window.parent.postMessage({ type: 'macosDialog', reqId: reqId, op: op, payload: payload || {} }, '*');
            setTimeout(function(){
                if (pending[reqId]) { delete pending[reqId]; resolve(null); }
            }, 60000);
        });
    }
    window.alert = function(msg){ send('alert', { message: msg }); };
    window.confirm = function(msg){ return send('confirm', { title: '确认', message: msg }); };
    window.prompt = function(msg, def){ return send('prompt', { title: '输入', message: msg, value: def }); };
})();
</script></body>
</html>
